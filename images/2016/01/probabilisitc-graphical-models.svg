<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-labelledby="t d">
  <title id="t">Families of probabilistic graphical models</title>
  <desc id="d">Nested sets. Probabilistic graphical models split into directed and undirected models. Directed models contain Bayesian networks, which contain dynamic Bayesian networks (DBNs) such as hidden Markov models (HMMs). Undirected models contain Markov random fields, which contain conditional random fields (CRFs). DBNs, HMMs and CRFs are the families used for time series.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .line  { stroke: #676a72; }
      .aline { stroke: #4fc07d; }
    }
  </style>
  <rect class="sunk" x="12" y="12" width="656" height="306" rx="14" fill="#ebebed" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="340" y="42" fill="#1c2320" font-size="17" text-anchor="middle" font-weight="700">Probabilistic graphical models</text>
  <rect class="card" x="28" y="60" width="300" height="222" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="46" y="86" fill="#1c2320" font-size="15" text-anchor="start" font-weight="700">Directed models</text>
  <rect class="card" x="42" y="100" width="272" height="168" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="58" y="124" fill="#1c2320" font-size="14" text-anchor="start" font-weight="600">Bayesian networks</text>
  <rect class="soft" x="56" y="138" width="244" height="116" rx="8" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <text class="ink" x="178" y="178" fill="#1c2320" font-size="14" text-anchor="middle" font-weight="600">Dynamic Bayesian networks</text>
  <text class="muted" x="178" y="197" fill="#5b6660" font-size="12" text-anchor="middle">(DBNs)</text>
  <rect class="card" x="100" y="210" width="156" height="30" rx="15" fill="#ffffff" stroke="#1f7a45" stroke-width="1.2"/>
  <text class="ink" x="178" y="229" fill="#1c2320" font-size="12.5" text-anchor="middle">e.g. hidden Markov models</text>
  <rect class="card" x="352" y="60" width="300" height="222" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="370" y="86" fill="#1c2320" font-size="15" text-anchor="start" font-weight="700">Undirected models</text>
  <rect class="card" x="366" y="100" width="272" height="168" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="382" y="124" fill="#1c2320" font-size="14" text-anchor="start" font-weight="600">Markov random fields</text>
  <rect class="soft" x="380" y="138" width="244" height="116" rx="8" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <text class="ink" x="502" y="190" fill="#1c2320" font-size="14" text-anchor="middle" font-weight="600">Conditional random fields</text>
  <text class="muted" x="502" y="209" fill="#5b6660" font-size="12" text-anchor="middle">(CRFs)</text>
  <rect class="soft" x="28" y="294" width="14" height="14" rx="3" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <text class="muted" x="50" y="305.5" fill="#5b6660" font-size="12" text-anchor="start">models for time series</text>
</svg>
