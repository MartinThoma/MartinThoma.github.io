<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" aria-labelledby="t d">
  <title id="t">Three filters for tracking robots</title>
  <desc id="d">Comparison of three filters for tracking a robot. Kalman filter: continuous state space, uni-modal belief. Monte-Carlo localization: discrete state space, multi-modal belief. Particle filter: continuous state space, multi-modal belief.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .hair  { stroke: #2e3036; }
    }
  </style>
  <text class="ink" x="24" y="28" fill="#1c2320" font-size="16" text-anchor="start" font-weight="600">Tracking robots</text>
  <text class="muted" x="24" y="47" fill="#5b6660" font-size="12.5" text-anchor="start">Three filters that estimate where a robot is.</text>
  <text class="muted" x="136" y="160" fill="#5b6660" font-size="12.5" text-anchor="end">state space</text>
  <text class="muted" x="136" y="206" fill="#5b6660" font-size="12.5" text-anchor="end">belief</text>
  <rect class="card" x="150" y="66" width="164" height="166" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="232" y="102" fill="#1c2320" font-size="14.5" text-anchor="middle" font-weight="700">Kalman filter</text>
  <path class="hair" d="M164 126 L300 126" stroke="#d8d8de" stroke-width="1"/>
  <rect class="sunk" x="168" y="140" width="128" height="30" rx="15" fill="#ebebed" stroke="#d8d8de" stroke-width="1.2"/>
  <text class="ink" x="232" y="160" fill="#1c2320" font-size="13" text-anchor="middle">continuous</text>
  <rect class="sunk" x="168" y="186" width="128" height="30" rx="15" fill="#ebebed" stroke="#d8d8de" stroke-width="1.2"/>
  <text class="ink" x="232" y="206" fill="#1c2320" font-size="13" text-anchor="middle">uni-modal</text>
  <rect class="card" x="322" y="66" width="164" height="166" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="404" y="92" fill="#1c2320" font-size="14.5" text-anchor="middle" font-weight="700">Monte-Carlo</text>
  <text class="ink" x="404" y="111" fill="#1c2320" font-size="14.5" text-anchor="middle" font-weight="700">localization</text>
  <path class="hair" d="M336 126 L472 126" stroke="#d8d8de" stroke-width="1"/>
  <rect class="sunk" x="340" y="140" width="128" height="30" rx="15" fill="#ebebed" stroke="#d8d8de" stroke-width="1.2"/>
  <text class="ink" x="404" y="160" fill="#1c2320" font-size="13" text-anchor="middle">discrete</text>
  <rect class="sunk" x="340" y="186" width="128" height="30" rx="15" fill="#ebebed" stroke="#d8d8de" stroke-width="1.2"/>
  <text class="ink" x="404" y="206" fill="#1c2320" font-size="13" text-anchor="middle">multi-modal</text>
  <rect class="card" x="494" y="66" width="164" height="166" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="576" y="102" fill="#1c2320" font-size="14.5" text-anchor="middle" font-weight="700">Particle filter</text>
  <path class="hair" d="M508 126 L644 126" stroke="#d8d8de" stroke-width="1"/>
  <rect class="sunk" x="512" y="140" width="128" height="30" rx="15" fill="#ebebed" stroke="#d8d8de" stroke-width="1.2"/>
  <text class="ink" x="576" y="160" fill="#1c2320" font-size="13" text-anchor="middle">continuous</text>
  <rect class="sunk" x="512" y="186" width="128" height="30" rx="15" fill="#ebebed" stroke="#d8d8de" stroke-width="1.2"/>
  <text class="ink" x="576" y="206" fill="#1c2320" font-size="13" text-anchor="middle">multi-modal</text>
</svg>
