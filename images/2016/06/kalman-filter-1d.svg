<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
<title id="t">A Kalman filter tracking a position from noisy measurements</title>
<desc id="d">Simulated one-dimensional tracking over 50 time steps. The true position rises with a slowly changing speed. The measurements scatter around it with a standard deviation of 4. The Kalman filter estimate with a constant-velocity model follows the true position closely: its root mean squared error is about 1.3 after the first steps, compared to 3.8 for the raw measurements.</desc>
