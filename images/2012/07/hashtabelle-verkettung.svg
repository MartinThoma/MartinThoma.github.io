.f-c3{fill:#1baf7a}.s-c3{stroke:#1baf7a}
.f-c4{fill:#eda100}.s-c4{stroke:#eda100}
.f-c5{fill:#e87ba4}.s-c5{stroke:#e87ba4}
@media (prefers-color-scheme: dark){
.f-ink{fill:#e7ede9}.s-ink{stroke:#e7ede9}
.f-muted{fill:#9aa8a0}.s-muted{stroke:#9aa8a0}
.f-faint{fill:#6b756f}.s-faint{stroke:#6b756f}
.f-hair{fill:#3a3d44}.s-hair{stroke:#3a3d44}
.f-sunk{fill:#26282e}.s-sunk{stroke:#26282e}
.f-bg{fill:#1b1d22}.s-bg{stroke:#1b1d22}
