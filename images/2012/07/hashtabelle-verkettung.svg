.f-warn{fill:#f0a050}.s-warn{stroke:#f0a050}
.f-softwarn{fill:#4a3420}.s-softwarn{stroke:#4a3420}
.f-bad{fill:#f07a70}.s-bad{stroke:#f07a70}
.f-softbad{fill:#4a2422}.s-softbad{stroke:#4a2422}
.f-blue{fill:#3987e5}.s-blue{stroke:#3987e5}
.f-softblue{fill:#1d3150}.s-softblue{stroke:#1d3150}
.f-c1{fill:#3987e5}.s-c1{stroke:#3987e5}
.f-c2{fill:#d95926}.s-c2{stroke:#d95926}
.f-c3{fill:#199e70}.s-c3{stroke:#199e70}
