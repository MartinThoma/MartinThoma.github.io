<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 348" width="600" height="348" role="img" aria-labelledby="t d">
<title id="t">Hashtabelle mit Verkettung</title>
<desc id="d">Eine Hashtabelle mit m = 7 Slots und der Divisions-Rest-Methode h(k) = k mod 7. Die Schlüssel 15, 8, 22, 4, 11, 30 werden eingefügt. 15, 8 und 22 landen alle in Slot 1 und bilden dort eine verkettete Liste, 4 und 11 in Slot 4, 30 in Slot 2. Der Belegungsfaktor ist α = 6/7.</desc>
<style>
text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}.mono,.mono tspan{font-family:ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
