<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" aria-labelledby="t d">
<title id="t">Long division of 1/7 and its cycle of remainders</title>
<desc id="d">Dividing 1 by 7 by hand gives the remainders 1, 3, 2, 6, 4, 5 and then remainder 1 again. From there on, the digits 142857 repeat. The remainders form a cycle; each arrow is labelled with the digit it produces.</desc>
<style>
text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}.mono,.mono tspan{font-family:ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
