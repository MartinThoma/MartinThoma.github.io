<text x="30" y="36" class="f-muted" font-size="15" dominant-baseline="central" >1 ÷ 7 with pen and paper</text>
<text x="30" y="76" font-size="17" dominant-baseline="central" class="mono" xml:space="preserve"><tspan class="f-ink">10 = </tspan><tspan class="f-acc" font-weight="700">1</tspan><tspan class="f-ink"> · 7 + </tspan><tspan class="f-warn" font-weight="700">3</tspan></text>
<text x="30" y="112" font-size="17" dominant-baseline="central" class="mono" xml:space="preserve"><tspan class="f-ink">30 = </tspan><tspan class="f-acc" font-weight="700">4</tspan><tspan class="f-ink"> · 7 + </tspan><tspan class="f-warn" font-weight="700">2</tspan></text>
<text x="30" y="148" font-size="17" dominant-baseline="central" class="mono" xml:space="preserve"><tspan class="f-ink">20 = </tspan><tspan class="f-acc" font-weight="700">2</tspan><tspan class="f-ink"> · 7 + </tspan><tspan class="f-warn" font-weight="700">6</tspan></text>
<text x="30" y="184" font-size="17" dominant-baseline="central" class="mono" xml:space="preserve"><tspan class="f-ink">60 = </tspan><tspan class="f-acc" font-weight="700">8</tspan><tspan class="f-ink"> · 7 + </tspan><tspan class="f-warn" font-weight="700">4</tspan></text>
<text x="30" y="220" font-size="17" dominant-baseline="central" class="mono" xml:space="preserve"><tspan class="f-ink">40 = </tspan><tspan class="f-acc" font-weight="700">5</tspan><tspan class="f-ink"> · 7 + </tspan><tspan class="f-warn" font-weight="700">5</tspan></text>
<text x="30" y="256" font-size="17" dominant-baseline="central" class="mono" xml:space="preserve"><tspan class="f-ink">50 = </tspan><tspan class="f-acc" font-weight="700">7</tspan><tspan class="f-ink"> · 7 + </tspan><tspan class="f-warn" font-weight="700">1</tspan></text>
<text x="190" y="256" class="f-muted" font-size="14" dominant-baseline="central" >← remainder 1 again</text>
<text x="30" y="308" font-size="17" dominant-baseline="central" class="mono" xml:space="preserve"><tspan class="f-ink">1/7 = 0.</tspan><tspan class="f-acc" font-weight="700">142857</tspan><tspan class="f-ink"> </tspan><tspan class="f-acc" font-weight="700">142857</tspan><tspan class="f-ink"> …</tspan></text>
