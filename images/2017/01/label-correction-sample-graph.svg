<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="t d">
<title id="t">The search graph of sample_1</title>
<desc id="d">An undirected graph with the nodes A to M where every edge has weight 1: A–B, A–C, B–D, B–E, C–F, C–G, D–H, D–I, E–J, G–K, H–L and J–M. The search goes from the start A to the target F; the shortest path A–C–F has length 2.</desc>
