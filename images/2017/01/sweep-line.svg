<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="img" aria-labelledby="t d">
<title id="t">The sweep line algorithm</title>
<desc id="d">Six line segments a to f and a vertical sweep line at x = 330 that moves from left to right. Segments that the sweep line currently crosses are active and kept in a data structure ordered from top to bottom. Segments left of the line are done, those right of it are not reached yet. Intersections left of the sweep line are already found. The dots on the axis are the event points: the segment end points.</desc>
