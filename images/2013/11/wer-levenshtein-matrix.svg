<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 448" width="632" height="448" role="img" aria-labelledby="t d">
<title id="t">Word error rate: Levenshtein matrix and alignment</title>
<desc id="d">The Levenshtein matrix for the reference 'what a bright day' and the hypothesis 'what the bright sunny day'. The cheapest path through the matrix keeps 'what', substitutes 'a' by 'the', keeps 'bright', inserts 'sunny' and keeps 'day'. Two errors on four reference words give a WER of 50%.</desc>
