<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" role="img" aria-labelledby="t d">
  <title id="t">How a credential stuffing attack works</title>
  <desc id="d">Credentials leaked in an unrelated breach are replayed by an attacker against many services. Logins at the webmail provider and the bank fail because a different password was used there. The login at the shop succeeds because the same password was reused. The attack targets many people at once rather than one specific account.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .ona   { fill: #08140d; }
      .badt  { fill: #ef8a8a; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .bad   { fill: #2a1a1a; stroke: #ef8a8a; }
      .fa    { fill: #4fc07d; }
      .line  { stroke: #676a72; }
      .aline { stroke: #4fc07d; }
      .bline { stroke: #ef8a8a; }
      .hair  { stroke: #2e3036; }
      .mk    { fill: #676a72; }
      .mka   { fill: #4fc07d; }
      .mkb   { fill: #ef8a8a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#88888f"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mka" d="M0 0 L10 5 L0 10 z" fill="#1f7a45"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mkb" d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect class="sunk" x="20" y="56" width="176" height="108" rx="10" fill="#ebebed" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="108" y="80" fill="#1c2320" font-size="14" text-anchor="middle" font-weight="600">Leaked credentials</text>
  <text class="muted" x="108" y="100" fill="#5b6660" font-size="12" text-anchor="middle">from some other breach</text>
  <text class="muted mono" x="108" y="122" fill="#5b6660" font-size="11" text-anchor="middle">ana@mail • hunter2</text>
  <text class="muted mono" x="108" y="138" fill="#5b6660" font-size="11" text-anchor="middle">bo@mail • qwerty123</text>
  <text class="muted mono" x="108" y="154" fill="#5b6660" font-size="11" text-anchor="middle">cy@mail • letmein</text>
  <rect class="bad" x="252" y="84" width="152" height="56" rx="10" fill="#fbe9e9" stroke="#c62828" stroke-width="1.5"/>
  <text class="badt" x="328" y="108" fill="#c62828" font-size="15" text-anchor="middle" font-weight="600">Attacker</text>
  <text class="muted" x="328" y="126" fill="#5b6660" font-size="11.5" text-anchor="middle">replays them everywhere</text>
  <path class="line" d="M196 112 L246 112" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="card" x="468" y="40" width="190" height="68" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="492" y="70" fill="#1c2320" font-size="15" text-anchor="start" font-weight="600">Webmail</text>
  <text class="muted" x="492" y="90" fill="#5b6660" font-size="12" text-anchor="start">different password</text>
  <text class="muted" x="634" y="74" fill="#5b6660" font-size="20" text-anchor="end" font-weight="700">✗</text>
  <path class="line" d="M404 112 C436 112 436 74 462 74" fill="none" stroke="#88888f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect class="card" x="468" y="132" width="190" height="68" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="492" y="162" fill="#1c2320" font-size="15" text-anchor="start" font-weight="600">Bank</text>
  <text class="muted" x="492" y="182" fill="#5b6660" font-size="12" text-anchor="start">different password</text>
  <text class="muted" x="634" y="166" fill="#5b6660" font-size="20" text-anchor="end" font-weight="700">✗</text>
  <path class="line" d="M404 112 C436 112 436 166 462 166" fill="none" stroke="#88888f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect class="bad" x="468" y="224" width="190" height="68" rx="10" fill="#fbe9e9" stroke="#c62828" stroke-width="1.5"/>
  <text class="ink" x="492" y="254" fill="#1c2320" font-size="15" text-anchor="start" font-weight="600">Shop</text>
  <text class="badt" x="492" y="274" fill="#c62828" font-size="12" text-anchor="start">same password reused</text>
  <text class="badt" x="634" y="258" fill="#c62828" font-size="22" text-anchor="end" font-weight="700">✓</text>
  <path class="bline" d="M404 112 C436 112 436 258 462 258" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#ab)"/>
  <text class="muted" x="340" y="334" fill="#5b6660" font-size="12.5" text-anchor="middle">One reused password is enough — the attack targets many people, not you.</text>
</svg>
