<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" width="760" height="492" role="img" aria-labelledby="t d">
  <title id="t">Software components of the security camera system and how they communicate</title>
  <desc id="d">Three components run inside the home network, which works without an internet connection. The camera runs motion and face detection, privacy modes and zones, holds a security key and has microSD storage. The central server handles users, roles and two-factor authentication, keeps an append-only audit log, stores videos and device metadata, provides firmware updates and serves the web application. The user device, a phone or laptop, runs the web application in the browser. The camera sends alerts and video to the server; the server sends settings and firmware updates to the camera. This uses an open, encrypted protocol in which the camera authenticates with its key. The server sends video and alerts to the user device; the user device sends settings and commands to the server, over an open, encrypted protocol with user login and 2FA. For the initial setup the user device talks to the camera directly via Bluetooth. Optionally, the camera synchronizes its clock with a time server on the internet.</desc>
