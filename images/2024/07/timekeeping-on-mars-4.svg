<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="t d">
<title id="t">Sidereal day versus solar day</title>
<desc id="d">A planet orbits the Sun and rotates counter-clockwise. From position 1 to position 2 it rotates once relative to the distant stars (sidereal day). Because it has moved along its orbit, it must rotate a bit further until the Sun is in the same direction again at position 3 (solar day).</desc>
