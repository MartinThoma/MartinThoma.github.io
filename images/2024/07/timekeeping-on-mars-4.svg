<circle cx="62" cy="330" r="48" class="f-sun"/><text x="62" y="398" class="f-ink" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central" >Sun</text><path d="M490.5 486.0 A456 456 0 0 0 390.0 13.2" class="s-faint" fill="none" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M482.0 330.0 H118" class="s-ink" fill="none" stroke-width="1.8" marker-end="url(#m-ink)"/><path d="M464.3 204.3 H118" class="s-ink" fill="none" stroke-width="1.8" marker-end="url(#m-ink)"/><path d="M432.8 132.8 L106.1 306.5" class="s-ink" fill="none" stroke-width="1.8" marker-end="url(#m-ink)"/><text x="122" y="188.3093657474484" class="f-muted" font-size="14" font-weight="500" text-anchor="start" dominant-baseline="central" >direction of a distant star</text><text x="150" y="348.0" class="f-muted" font-size="14" font-weight="500" text-anchor="start" dominant-baseline="central" >direction of the Sun</text><circle cx="518.0" cy="330.0" r="34" class="f-softblue s-blue" stroke-width="2"/><text x="530.0" y="330.0" class="f-ink" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >1</text><circle cx="500.3" cy="204.3" r="34" class="f-softblue s-blue" stroke-width="2"/><text x="512.3353333478734" y="204.3093657474484" class="f-ink" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >2</text><circle cx="464.6" cy="115.9" r="34" class="f-softblue s-blue" stroke-width="2"/><text x="476.6241023436707" y="115.92096736963379" class="f-ink" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="central" >3</text><path d="M518.0 330.0 h-28" class="s-bad" stroke-width="2.5" marker-end="url(#m-bad)" fill="none"/><path d="M500.3 204.3 h-28" class="s-bad" stroke-width="2.5" marker-end="url(#m-bad)" fill="none"/><path d="M464.6 115.9 l-24.7 13.1" class="s-bad" stroke-width="2.5" marker-end="url(#m-bad)" fill="none"/><path d="M566.0 360.0 A40 40 0 0 0 566.0 300.0" class="s-ink" fill="none" stroke-width="1.8" marker-end="url(#m-ink)"/><path d="M548.3 234.3 A40 40 0 0 0 548.3 174.3" class="s-ink" fill="none" stroke-width="1.8" marker-end="url(#m-ink)"/><path d="M512.6 145.9 A40 40 0 0 0 512.6 85.9" class="s-ink" fill="none" stroke-width="1.8" marker-end="url(#m-ink)"/><text x="425.316266062254" y="36.8888499829381" class="f-faint" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="central" >Orbit</text><line x1="24" y1="452" x2="44" y2="452" class="s-bad" stroke-width="2.5" marker-end="url(#m-bad)"/><text x="52" y="452" class="f-muted" font-size="14" font-weight="500" text-anchor="start" dominant-baseline="central" >orientation of the planet</text><text x="24" y="478" class="f-muted" font-size="14" font-weight="500" text-anchor="start" dominant-baseline="central" >1 → 2: sidereal day (one full rotation relative to the stars)</text><text x="24" y="502" class="f-muted" font-size="14" font-weight="500" text-anchor="start" dominant-baseline="central" >1 → 3: solar day (the Sun is in the same direction again)</text>
</svg>
