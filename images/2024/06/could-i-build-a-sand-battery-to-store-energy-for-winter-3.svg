<title id="t">Sand heat storage around a cellar</title>
<desc id="d">Cross-section of a house with a cellar. On both sides of the cellar wall there is a column of sand used as heat storage, with insulation on its outer side and on top. The whole structure stands on a foundation slab.</desc>
