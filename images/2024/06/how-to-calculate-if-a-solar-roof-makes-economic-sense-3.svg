<title id="t">Gable roof geometry</title>
<desc id="d">Front view of a house with a gable roof. The roof slope x (red) rises with pitch α. Below the house, the overhang a (purple) and half the house width b (green) are marked; together a + b is the horizontal extent of the roof slope.</desc>
