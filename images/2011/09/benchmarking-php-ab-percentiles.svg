<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">ApacheBench response times</title>
<desc id="d">Schematic chart of ab output: response time in milliseconds over the percentage of requests. The curve stays flat around 1.1 ms up to 90 percent and rises steeply in the last percent to 7.2 ms; the mean time per request is 1.16 ms.</desc>
<style>
.sans{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif}
.mono{font-family:ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
.bg{fill:#ffffff} .grid{stroke:#e3e7ed;stroke-width:1} .axis{stroke:#9aa3ae;stroke-width:1.5}
.tick{fill:#5b6573;font-size:16px} .lab{fill:#5b6573;font-size:16px} .ttl{fill:#1f2630;font-size:22px;font-weight:600}
.cmd{fill:#1f2630;font-size:18px} .line{fill:none;stroke:#3b7dd8;stroke-width:3;stroke-linejoin:round}
.area{fill:#3b7dd8;opacity:.12} .dot{fill:#3b7dd8;stroke:#ffffff;stroke-width:2.5}
.leader{stroke:#9aa3ae;stroke-width:1.5} .note{fill:#1f2630;font-size:17px}
.mean{stroke:#d6504a;stroke-width:2;stroke-dasharray:8 6} .meantxt{fill:#b8403b;font-size:17px}
@media (prefers-color-scheme: dark){
.bg{fill:#1b1f27} .grid{stroke:#2c3340} .axis{stroke:#6f7888}
.tick,.lab{fill:#a7b0bd} .ttl,.cmd,.note{fill:#e9edf2} .line{stroke:#6aa5f0} .area{fill:#6aa5f0;opacity:.16}
.dot{fill:#6aa5f0;stroke:#1b1f27} .leader{stroke:#6f7888} .mean{stroke:#f08a84} .meantxt{fill:#f08a84}
}
</style>
<rect width="960" height="540" class="bg"/>
<g class="sans">
<text x="40" y="44" class="ttl">Percentage of the requests served within a certain time</text>
<text x="40" y="76" class="mono cmd">$ ab -n 1000 -c 1 localhost/empty.php</text>
<line x1="110" y1="450.0" x2="900" y2="450.0" class="grid"/><text x="98" y="455.0" text-anchor="end" class="tick">0</text><line x1="110" y1="365.0" x2="900" y2="365.0" class="grid"/><text x="98" y="370.0" text-anchor="end" class="tick">2</text><line x1="110" y1="280.0" x2="900" y2="280.0" class="grid"/><text x="98" y="285.0" text-anchor="end" class="tick">4</text><line x1="110" y1="195.0" x2="900" y2="195.0" class="grid"/><text x="98" y="200.0" text-anchor="end" class="tick">6</text><line x1="110" y1="110.0" x2="900" y2="110.0" class="grid"/><text x="98" y="115.0" text-anchor="end" class="tick">8</text><text x="110.0" y="476" text-anchor="middle" class="tick">0 %</text><text x="307.5" y="476" text-anchor="middle" class="tick">25 %</text><text x="505.0" y="476" text-anchor="middle" class="tick">50 %</text><text x="702.5" y="476" text-anchor="middle" class="tick">75 %</text><text x="900.0" y="476" text-anchor="middle" class="tick">100 %</text>
<line x1="110" y1="450" x2="900" y2="450" class="axis"/>
<text x="505.0" y="506" text-anchor="middle" class="lab">share of the 1000 requests, sorted from fastest to slowest</text>
<text transform="translate(58 280.0) rotate(-90)" text-anchor="middle" class="lab">response time (ms)</text>
<polygon points="110.0,450.0 110.0,409.6 189.0,406.6 268.0,404.9 347.0,403.7 426.0,402.8 505.0,402.0 584.0,401.1 663.0,399.9 742.0,398.1 821.0,394.3 860.5,385.4 884.2,362.9 892.1,339.5 896.8,275.8 900.0,144.0 900.0,450.0" class="area"/>
<polyline points="110.0,409.6 189.0,406.6 268.0,404.9 347.0,403.7 426.0,402.8 505.0,402.0 584.0,401.1 663.0,399.9 742.0,398.1 821.0,394.3 860.5,385.4 884.2,362.9 892.1,339.5 896.8,275.8 900.0,144.0" class="line"/>
<line x1="110" y1="400.7" x2="900" y2="400.7" class="mean"/>
<text x="120" y="426.7" class="meantxt">mean “Time per request”: 1.16 ms</text>
<circle cx="505.0" cy="402.0" r="6" class="dot"/><line x1="505.0" y1="402.0" x2="505.0" y2="317.0" class="leader"/><text x="505.0" y="307.0" text-anchor="middle" class="note">median: half of the requests take ≤ 1.13 ms</text><circle cx="860.5" cy="385.4" r="6" class="dot"/><line x1="860.5" y1="385.4" x2="800.5" y2="325.4" class="leader"/><text x="794.5" y="315.4" text-anchor="end" class="note">95 %: ≤ 1.5 ms</text><circle cx="900.0" cy="144.0" r="6" class="dot"/><line x1="900.0" y1="144.0" x2="860.0" y2="144.0" class="leader"/><text x="854.0" y="149.0" text-anchor="end" class="note">slowest request: 7.2 ms</text>
</g>
</svg>
