<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
  <title id="t">Multiple inheritance: C inherits from B1 and B2, both inherit from A</title>
  <desc id="d">A diamond of four classes. class A is the base class. class B1(A) and class B2(A) both inherit from A. class C(B1, B2) inherits from B1 and B2, with B1 listed first. Arrows with a hollow triangle point from each child class to its parents.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .line  { stroke: #676a72; }
      .tri   { fill: #1b1d22; stroke: #676a72; }
    }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path class="tri" d="M1 1 L13 7 L1 13 z" fill="#ffffff" stroke="#88888f" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="card" x="215" y="20" width="170" height="60" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="300" y="46" fill="#1c2320" font-size="17" text-anchor="middle" font-weight="700">A</text>
  <text class="muted mono" x="300" y="66" fill="#5b6660" font-size="12" text-anchor="middle">class A</text>
  <rect class="card" x="65" y="130" width="170" height="60" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="150" y="156" fill="#1c2320" font-size="17" text-anchor="middle" font-weight="700">B1</text>
  <text class="muted mono" x="150" y="176" fill="#5b6660" font-size="12" text-anchor="middle">class B1(A)</text>
  <rect class="card" x="365" y="130" width="170" height="60" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="450" y="156" fill="#1c2320" font-size="17" text-anchor="middle" font-weight="700">B2</text>
  <text class="muted mono" x="450" y="176" fill="#5b6660" font-size="12" text-anchor="middle">class B2(A)</text>
  <rect class="soft" x="215" y="240" width="170" height="60" rx="10" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <text class="ink" x="300" y="266" fill="#1c2320" font-size="17" text-anchor="middle" font-weight="700">C</text>
  <text class="muted mono" x="300" y="286" fill="#5b6660" font-size="12" text-anchor="middle">class C(B1, B2)</text>
  <path class="line" d="M180 130 L270 80" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#g)"/>
  <path class="line" d="M420 130 L330 80" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#g)"/>
  <path class="line" d="M270 240 L180 190" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#g)"/>
  <path class="line" d="M330 240 L420 190" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#g)"/>
  <path class="line" d="M24 324 L58 324" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#g)"/>
  <text class="muted" x="68" y="328" fill="#5b6660" font-size="12" text-anchor="start">inherits from</text>
  <rect class="soft" x="170" y="316" width="16" height="16" rx="4" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <text class="muted" x="194" y="328" fill="#5b6660" font-size="12" text-anchor="start">the class called as <tspan class="mono">C()</tspan></text>
</svg>
