<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" role="img" aria-labelledby="t d">
<title id="t">Call tree of the recursive Fibonacci function for f(5)</title>
<desc id="d">The naive recursion for f(5) makes 15 calls. Many of them repeat: f(3) is computed twice, f(2) three times. With memoization only 6 calls compute something, 3 calls return a stored result, and the grey subtrees below them are never called.</desc>
