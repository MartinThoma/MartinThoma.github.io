<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" width="680" height="236" role="img" aria-labelledby="t d">
  <title id="t">Distribution of transaction amounts in 2020</title>
  <desc id="d">A box plot on a logarithmic scale of the 510 transaction amounts. The minimum is 0.19 euro, the 25th percentile 4.94 euro, the median 9.99 euro, the 75th percentile 20.95 euro and the maximum 419 euro. The mean of 27.87 euro lies above the 75th percentile because a few large rent payments drag it up.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .ona   { fill: #08140d; }
      .badt  { fill: #ef8a8a; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .bad   { fill: #2a1a1a; stroke: #ef8a8a; }
      .fa    { fill: #4fc07d; }
      .line  { stroke: #676a72; }
      .aline { stroke: #4fc07d; }
      .ol    { stroke: #4fc07d; }
      .bline { stroke: #ef8a8a; }
      .hair  { stroke: #2e3036; }
      .mk    { fill: #676a72; }
      .mka   { fill: #4fc07d; }
      .mkb   { fill: #ef8a8a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#88888f"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mka" d="M0 0 L10 5 L0 10 z" fill="#1f7a45"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mkb" d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
  </defs>
  <text class="ink" x="24" y="28" fill="#1c2320" font-size="16" text-anchor="start" font-weight="600">Most transactions are small — a few are not</text>
  <text class="muted" x="24" y="47" fill="#5b6660" font-size="12.5" text-anchor="start">Distribution of the 510 transaction amounts (logarithmic scale).</text>
  <path class="hair" d="M70 171.0 L610 171.0" stroke="#d8d8de" stroke-width="1.5"/>
  <path class="hair" d="M70.0 166.0 L70.0 171.0" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="70.0" y="189.0" fill="#5b6660" font-size="11.5" text-anchor="middle">0.1 €</text>
  <path class="hair" d="M205.0 166.0 L205.0 171.0" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="205.0" y="189.0" fill="#5b6660" font-size="11.5" text-anchor="middle">1 €</text>
  <path class="hair" d="M340.0 166.0 L340.0 171.0" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="340.0" y="189.0" fill="#5b6660" font-size="11.5" text-anchor="middle">10 €</text>
  <path class="hair" d="M475.0 166.0 L475.0 171.0" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="475.0" y="189.0" fill="#5b6660" font-size="11.5" text-anchor="middle">100 €</text>
  <path class="hair" d="M610.0 166.0 L610.0 171.0" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="610.0" y="189.0" fill="#5b6660" font-size="11.5" text-anchor="middle">1 000 €</text>
  <path class="line" d="M107.6 118 L298.7 118" stroke="#88888f" stroke-width="1.5"/>
  <path class="line" d="M383.4 118 L559.0 118" stroke="#88888f" stroke-width="1.5"/>
  <path class="line" d="M107.6 107 L107.6 129" stroke="#88888f" stroke-width="1.5"/>
  <path class="line" d="M559.0 107 L559.0 129" stroke="#88888f" stroke-width="1.5"/>
  <rect class="soft" x="298.7" y="91.0" width="84.7" height="54" rx="4" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <path class="aline" d="M339.9 91.0 L339.9 145.0" stroke="#1f7a45" stroke-width="3"/>
  <circle class="fa" cx="400.1" cy="118" r="4.5" fill="#1f7a45"/>
  <text class="muted" x="107.63173612863191" y="78" fill="#5b6660" font-size="11.5" text-anchor="middle">min 0.19 €</text>
  <text class="ink" x="339.9413409105076" y="78" fill="#1c2320" font-size="12" text-anchor="middle" font-weight="600">median 9.99 €</text>
  <text class="muted" x="558.9988931004498" y="78" fill="#5b6660" font-size="11.5" text-anchor="middle">max 419 €</text>
  <text class="muted" x="298.65313810469235" y="164" fill="#5b6660" font-size="11.5" text-anchor="middle">25%: 4.94 €</text>
  <text class="muted" x="383.3598436858124" y="164" fill="#5b6660" font-size="11.5" text-anchor="middle">75%: 20.95 €</text>
  <text class="acc" x="409.09349077629605" y="102" fill="#1f7a45" font-size="11.5" text-anchor="start" font-weight="600">mean 27.87 €</text>
  <text class="muted" x="24" y="226" fill="#5b6660" font-size="12.5" text-anchor="start">Half of all transactions sit between 4.94 € and 20.95 €; the mean is dragged up by rent.</text>
</svg>
