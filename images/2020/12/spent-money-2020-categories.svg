<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" width="680" height="322" role="img" aria-labelledby="t d">
  <title id="t">Transactions per category in 2020</title>
  <desc id="d">A bar chart of how many of the 510 transactions fell into each named category: Food 208, Amazon 63, Rent, electricity and water 44, Household 26, Transport 21.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .ona   { fill: #08140d; }
      .badt  { fill: #ef8a8a; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .bad   { fill: #2a1a1a; stroke: #ef8a8a; }
      .fa    { fill: #4fc07d; }
      .line  { stroke: #676a72; }
      .aline { stroke: #4fc07d; }
      .ol    { stroke: #4fc07d; }
      .bline { stroke: #ef8a8a; }
      .hair  { stroke: #2e3036; }
      .mk    { fill: #676a72; }
      .mka   { fill: #4fc07d; }
      .mkb   { fill: #ef8a8a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#88888f"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mka" d="M0 0 L10 5 L0 10 z" fill="#1f7a45"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mkb" d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
  </defs>
  <text class="ink" x="24" y="28" fill="#1c2320" font-size="16" text-anchor="start" font-weight="600">How many transactions per category</text>
  <text class="muted" x="24" y="47" fill="#5b6660" font-size="12.5" text-anchor="start">Named categories, out of 510 transactions left after cleaning.</text>
  <text class="ink" x="208" y="78" fill="#1c2320" font-size="13.5" text-anchor="end">Food</text>
  <rect class="sunk" x="220" y="58" width="364" height="30" rx="5" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="fa" x="220" y="58" width="364" height="30" rx="5" fill="#1f7a45"/>
  <text class="ink" x="594" y="78" fill="#1c2320" font-size="13" text-anchor="start" font-weight="600">208×</text>
  <text class="ink" x="208" y="122" fill="#1c2320" font-size="13.5" text-anchor="end">Amazon</text>
  <rect class="sunk" x="220" y="102" width="364" height="30" rx="5" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="fa" x="220" y="102" width="110" height="30" rx="5" fill="#1f7a45"/>
  <text class="ink" x="594" y="122" fill="#1c2320" font-size="13" text-anchor="start" font-weight="600">63×</text>
  <text class="ink" x="208" y="166" fill="#1c2320" font-size="13.5" text-anchor="end">Rent / electricity / water</text>
  <rect class="sunk" x="220" y="146" width="364" height="30" rx="5" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="fa" x="220" y="146" width="77" height="30" rx="5" fill="#1f7a45"/>
  <text class="ink" x="594" y="166" fill="#1c2320" font-size="13" text-anchor="start" font-weight="600">44×</text>
  <text class="ink" x="208" y="210" fill="#1c2320" font-size="13.5" text-anchor="end">Household</text>
  <rect class="sunk" x="220" y="190" width="364" height="30" rx="5" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="fa" x="220" y="190" width="46" height="30" rx="5" fill="#1f7a45"/>
  <text class="ink" x="594" y="210" fill="#1c2320" font-size="13" text-anchor="start" font-weight="600">26×</text>
  <text class="ink" x="208" y="254" fill="#1c2320" font-size="13.5" text-anchor="end">Transport</text>
  <rect class="sunk" x="220" y="234" width="364" height="30" rx="5" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="fa" x="220" y="234" width="37" height="30" rx="5" fill="#1f7a45"/>
  <text class="ink" x="594" y="254" fill="#1c2320" font-size="13" text-anchor="start" font-weight="600">21×</text>
</svg>
