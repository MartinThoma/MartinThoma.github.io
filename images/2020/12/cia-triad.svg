<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 464" width="680" height="464" role="img" aria-labelledby="t d">
  <title id="t">The CIA triad</title>
  <desc id="d">A triangle labelled CIA triad, the three goals of cyber security. Its apex is Confidentiality, shown with a padlock: only authorized parties can read it. The bottom-left corner is Integrity, shown with a checked document: only authorized parties can add, edit or remove it. The bottom-right corner is Availability, shown with a server: users can reach the system as agreed in the SLA.</desc>
  <style>
    text { font-family: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .inset { stroke: #4fc07d; }
      .fa    { fill: #4fc07d; }
      .ico   { stroke: #08140d; }
      .icof  { fill: #08140d; }
    }
  </style>

  <!-- triangle -->
  <polygon class="soft" points="340,105 540,355 140,355" fill="#e0efe6" stroke="#1f7a45" stroke-width="2" stroke-linejoin="round"/>
  <polygon class="inset" points="340,141 493.4,332.6 186.6,332.6" fill="none" stroke="#1f7a45" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 5" stroke-linejoin="round"/>

  <!-- centre -->
  <text class="ink" x="340" y="262" fill="#1c2320" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.3">CIA triad</text>
  <rect class="fa" x="326" y="273" width="28" height="2.5" rx="1.25" fill="#1f7a45"/>
  <text class="muted" x="340" y="296" fill="#5b6660" font-size="13" text-anchor="middle">the three goals of</text>
  <text class="muted" x="340" y="313" fill="#5b6660" font-size="13" text-anchor="middle">cyber security</text>

  <!-- nodes -->
  <circle class="fa" cx="340" cy="105" r="28" fill="#1f7a45"/>
  <circle class="fa" cx="140" cy="355" r="28" fill="#1f7a45"/>
  <circle class="fa" cx="540" cy="355" r="28" fill="#1f7a45"/>

  <g class="ico" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- padlock -->
    <g transform="translate(340 105) scale(1.15) translate(-12 -12)">
      <rect x="4.5" y="10.5" width="15" height="11" rx="2.5"/>
      <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
      <path d="M12 15v2.5"/>
    </g>
    <!-- checked document -->
    <g transform="translate(140 355) scale(1.15) translate(-12 -12)">
      <path d="M14 2.5H7A2 2 0 0 0 5 4.5v15a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7.5z"/>
      <path d="M14 2.5v5h5"/>
      <path d="M9 14.5l2 2 4-4"/>
    </g>
    <!-- server -->
    <g transform="translate(540 355) scale(1.15) translate(-12 -12)">
      <rect x="3.5" y="3.5" width="17" height="7" rx="2"/>
      <rect x="3.5" y="13.5" width="17" height="7" rx="2"/>
      <path d="M12 7h4.5M12 17h4.5"/>
      <circle class="icof" cx="7" cy="7" r="1.2" fill="#ffffff" stroke="none"/>
      <circle class="icof" cx="7" cy="17" r="1.2" fill="#ffffff" stroke="none"/>
    </g>
  </g>

  <!-- labels -->
  <text class="ink" x="340" y="28" fill="#1c2320" font-size="16" font-weight="700" text-anchor="middle"><tspan class="acc" fill="#1f7a45">C</tspan>onfidentiality</text>
  <text class="muted" x="340" y="48" fill="#5b6660" font-size="13" text-anchor="middle">only authorized parties</text>
  <text class="muted" x="340" y="65" fill="#5b6660" font-size="13" text-anchor="middle">can read it</text>

  <text class="ink" x="140" y="409" fill="#1c2320" font-size="16" font-weight="700" text-anchor="middle"><tspan class="acc" fill="#1f7a45">I</tspan>ntegrity</text>
  <text class="muted" x="140" y="429" fill="#5b6660" font-size="13" text-anchor="middle">only authorized parties can</text>
  <text class="muted" x="140" y="446" fill="#5b6660" font-size="13" text-anchor="middle">add, edit or remove it</text>

  <text class="ink" x="540" y="409" fill="#1c2320" font-size="16" font-weight="700" text-anchor="middle"><tspan class="acc" fill="#1f7a45">A</tspan>vailability</text>
  <text class="muted" x="540" y="429" fill="#5b6660" font-size="13" text-anchor="middle">users can reach the system</text>
  <text class="muted" x="540" y="446" fill="#5b6660" font-size="13" text-anchor="middle">as agreed in the SLA</text>
</svg>
