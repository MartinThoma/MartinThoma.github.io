<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 284" width="680" height="284" role="img" aria-labelledby="t d">
  <title id="t">Top five recipients of my 2020 spending</title>
  <desc id="d">A bar chart of the five recipients I paid most in 2020: landlord and flatmates 6160 euro, Amazon 1384 euro, Penny 535 euro, Lidl 530 euro, Aldi 375 euro. Housing dwarfs every other category; the four remaining bars together are less than half of it.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .ona   { fill: #08140d; }
      .badt  { fill: #ef8a8a; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .bad   { fill: #2a1a1a; stroke: #ef8a8a; }
      .fa    { fill: #4fc07d; }
      .line  { stroke: #676a72; }
      .aline { stroke: #4fc07d; }
      .ol    { stroke: #4fc07d; }
      .bline { stroke: #ef8a8a; }
      .hair  { stroke: #2e3036; }
      .mk    { fill: #676a72; }
      .mka   { fill: #4fc07d; }
      .mkb   { fill: #ef8a8a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#88888f"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mka" d="M0 0 L10 5 L0 10 z" fill="#1f7a45"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mkb" d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
  </defs>
  <text class="ink" x="24" y="28" fill="#1c2320" font-size="16" text-anchor="start" font-weight="600">Where the money went in 2020</text>
  <text class="muted" x="24" y="47" fill="#5b6660" font-size="12.5" text-anchor="start">Top five recipients, consumer spending only (no investments).</text>
  <text class="ink" x="188" y="78" fill="#1c2320" font-size="13.5" text-anchor="end">Landlord + flatmates</text>
  <rect class="sunk" x="200" y="58" width="384" height="30" rx="5" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="fa" x="200" y="58" width="384" height="30" rx="5" fill="#1f7a45"/>
  <text class="ink" x="594" y="78" fill="#1c2320" font-size="13" text-anchor="start" font-weight="600">6 160 €</text>
  <text class="ink" x="188" y="122" fill="#1c2320" font-size="13.5" text-anchor="end">Amazon</text>
  <rect class="sunk" x="200" y="102" width="384" height="30" rx="5" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="fa" x="200" y="102" width="86" height="30" rx="5" fill="#1f7a45"/>
  <text class="ink" x="594" y="122" fill="#1c2320" font-size="13" text-anchor="start" font-weight="600">1 384 €</text>
  <text class="ink" x="188" y="166" fill="#1c2320" font-size="13.5" text-anchor="end">Penny</text>
  <rect class="sunk" x="200" y="146" width="384" height="30" rx="5" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="fa" x="200" y="146" width="33" height="30" rx="5" fill="#1f7a45"/>
  <text class="ink" x="594" y="166" fill="#1c2320" font-size="13" text-anchor="start" font-weight="600">535 €</text>
  <text class="ink" x="188" y="210" fill="#1c2320" font-size="13.5" text-anchor="end">Lidl</text>
  <rect class="sunk" x="200" y="190" width="384" height="30" rx="5" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="fa" x="200" y="190" width="33" height="30" rx="5" fill="#1f7a45"/>
  <text class="ink" x="594" y="210" fill="#1c2320" font-size="13" text-anchor="start" font-weight="600">530 €</text>
  <text class="ink" x="188" y="254" fill="#1c2320" font-size="13.5" text-anchor="end">Aldi</text>
  <rect class="sunk" x="200" y="234" width="384" height="30" rx="5" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="fa" x="200" y="234" width="23" height="30" rx="5" fill="#1f7a45"/>
  <text class="ink" x="594" y="254" fill="#1c2320" font-size="13" text-anchor="start" font-weight="600">375 €</text>
</svg>
