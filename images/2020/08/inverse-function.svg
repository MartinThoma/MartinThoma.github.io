<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-labelledby="t d">
  <title id="t">A function f and its inverse function f⁻¹</title>
  <desc id="d">The function f maps 1 to c, 2 to a and 3 to b. Its inverse f⁻¹ maps a back to 2, b back to 3 and c back to 1. Applying f and then f⁻¹ returns the original value, which is the property a test for a pair such as encrypt and decrypt can check.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .line  { stroke: #9aa8a0; }
      .aline { stroke: #4fc07d; }
      .mk    { fill: #9aa8a0; }
      .mka   { fill: #4fc07d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#5b6660"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mka" d="M0 0 L10 5 L0 10 z" fill="#1f7a45"/>
    </marker>
  </defs>
  <rect class="sunk" x="80" y="72" width="100" height="186" rx="50" fill="#ebebed" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="130" y="58" fill="#5b6660" font-size="14" text-anchor="middle" font-style="italic">x</text>
  <text class="ink" x="130" y="125" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">1</text>
  <text class="ink" x="130" y="172" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">2</text>
  <text class="ink" x="130" y="219" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">3</text>
  <rect class="soft" x="290" y="72" width="100" height="186" rx="50" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <text class="muted" x="340" y="58" fill="#5b6660" font-size="14" text-anchor="middle" font-style="italic">f(x)</text>
  <text class="ink" x="340" y="125" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">a</text>
  <text class="ink" x="340" y="172" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">b</text>
  <text class="ink" x="340" y="219" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">c</text>
  <rect class="sunk" x="500" y="72" width="100" height="186" rx="50" fill="#ebebed" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="550" y="58" fill="#5b6660" font-size="14" text-anchor="middle" font-style="italic">f⁻¹(f(x))</text>
  <text class="ink" x="550" y="125" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">1</text>
  <text class="ink" x="550" y="172" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">2</text>
  <text class="ink" x="550" y="219" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">3</text>
  <path class="aline" d="M150 118 L316 212" fill="none" stroke="#1f7a45" stroke-width="1.8" marker-end="url(#aa)"/>
  <path class="aline" d="M150 165 L316 118" fill="none" stroke="#1f7a45" stroke-width="1.8" marker-end="url(#aa)"/>
  <path class="aline" d="M150 212 L316 165" fill="none" stroke="#1f7a45" stroke-width="1.8" marker-end="url(#aa)"/>
  <path class="line" d="M360 118 L526 165" fill="none" stroke="#5b6660" stroke-width="1.8" marker-end="url(#a)"/>
  <path class="line" d="M360 165 L526 212" fill="none" stroke="#5b6660" stroke-width="1.8" marker-end="url(#a)"/>
  <path class="line" d="M360 212 L526 118" fill="none" stroke="#5b6660" stroke-width="1.8" marker-end="url(#a)"/>
  <text class="acc" x="235" y="36" fill="#1f7a45" font-size="18" text-anchor="middle" font-weight="700" font-style="italic">f</text>
  <text class="ink" x="445" y="36" fill="#1c2320" font-size="18" text-anchor="middle" font-weight="700" font-style="italic">f⁻¹</text>
  <text class="muted" x="340" y="300" fill="#5b6660" font-size="12.5" text-anchor="middle">Every value comes back unchanged: <tspan font-style="italic">f⁻¹(f(x)) = x</tspan> — a property you can test.</text>
</svg>
