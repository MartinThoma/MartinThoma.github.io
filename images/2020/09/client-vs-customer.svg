<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 286" width="680" height="286" role="img" aria-labelledby="t d">
  <title id="t">Customer versus client</title>
  <desc id="d">Two panels. A customer buys goods or services — for example at the supermarket, the hairdresser or the online shop. A client uses professional advice or services — for example from an accountant, an architect, an attorney or a consultant.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .ona   { fill: #08140d; }
      .badt  { fill: #ef8a8a; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .bad   { fill: #2a1a1a; stroke: #ef8a8a; }
      .fa    { fill: #4fc07d; }
      .line  { stroke: #676a72; }
      .aline { stroke: #4fc07d; }
      .bline { stroke: #ef8a8a; }
      .hair  { stroke: #2e3036; }
      .mk    { fill: #676a72; }
      .mka   { fill: #4fc07d; }
      .mkb   { fill: #ef8a8a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#88888f"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mka" d="M0 0 L10 5 L0 10 z" fill="#1f7a45"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mkb" d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
  </defs>
  <text class="muted" x="340" y="26" fill="#5b6660" font-size="13" text-anchor="middle">Who is on the other side of the transaction?</text>
  <rect class="soft" x="24" y="44" width="300" height="220" rx="12" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <text class="ink" x="48" y="78" fill="#1c2320" font-size="20" text-anchor="start" font-weight="600">Customer</text>
  <text class="muted" x="48" y="102" fill="#5b6660" font-size="13" text-anchor="start">buys goods or services</text>
  <path class="hair" d="M48 118 L300 118" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="48" y="142" fill="#5b6660" font-size="12" text-anchor="start">You are one at…</text>
  <circle class="fa" cx="54" cy="163" r="3" fill="#1f7a45"/>
  <text class="ink" x="68" y="168" fill="#1c2320" font-size="14" text-anchor="start">the supermarket</text>
  <circle class="fa" cx="54" cy="187" r="3" fill="#1f7a45"/>
  <text class="ink" x="68" y="192" fill="#1c2320" font-size="14" text-anchor="start">the hairdresser</text>
  <circle class="fa" cx="54" cy="211" r="3" fill="#1f7a45"/>
  <text class="ink" x="68" y="216" fill="#1c2320" font-size="14" text-anchor="start">the online shop</text>
  <rect class="soft" x="356" y="44" width="300" height="220" rx="12" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <text class="ink" x="380" y="78" fill="#1c2320" font-size="20" text-anchor="start" font-weight="600">Client</text>
  <text class="muted" x="380" y="102" fill="#5b6660" font-size="13" text-anchor="start">uses professional advice or services</text>
  <path class="hair" d="M380 118 L632 118" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="380" y="142" fill="#5b6660" font-size="12" text-anchor="start">You are one at…</text>
  <circle class="fa" cx="386" cy="163" r="3" fill="#1f7a45"/>
  <text class="ink" x="400" y="168" fill="#1c2320" font-size="14" text-anchor="start">the accountant</text>
  <circle class="fa" cx="386" cy="187" r="3" fill="#1f7a45"/>
  <text class="ink" x="400" y="192" fill="#1c2320" font-size="14" text-anchor="start">the architect</text>
  <circle class="fa" cx="386" cy="211" r="3" fill="#1f7a45"/>
  <text class="ink" x="400" y="216" fill="#1c2320" font-size="14" text-anchor="start">the attorney</text>
  <circle class="fa" cx="386" cy="235" r="3" fill="#1f7a45"/>
  <text class="ink" x="400" y="240" fill="#1c2320" font-size="14" text-anchor="start">the consultant</text>
</svg>
