<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" aria-labelledby="t d">
  <title id="t">Why a cropped preview can be biased</title>
  <desc id="d">A tall shared image contains two people. Only part of it fits the preview, so a saliency model trained on human data chooses which region to keep. The resulting preview shows only one of the two people; whoever is left out is invisible to almost every reader.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .ona   { fill: #08140d; }
      .badt  { fill: #ef8a8a; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .bad   { fill: #2a1a1a; stroke: #ef8a8a; }
      .fa    { fill: #4fc07d; }
      .line  { stroke: #676a72; }
      .aline { stroke: #4fc07d; }
      .ol    { stroke: #4fc07d; }
      .bline { stroke: #ef8a8a; }
      .hair  { stroke: #2e3036; }
      .mk    { fill: #676a72; }
      .mka   { fill: #4fc07d; }
      .mkb   { fill: #ef8a8a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#88888f"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mka" d="M0 0 L10 5 L0 10 z" fill="#1f7a45"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mkb" d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
  </defs>
  <text class="ink" x="340" y="26" fill="#1c2320" font-size="16" text-anchor="middle" font-weight="600">A preview has to be cropped — something gets left out</text>
  <rect class="sunk" x="60" y="48" width="150" height="236" rx="8" fill="#ebebed" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="135" y="42" fill="#5b6660" font-size="12" text-anchor="middle">shared image</text>
  <rect class="card" x="78" y="70" width="114" height="90" rx="6" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <circle class="fa" cx="135" cy="104" r="17" fill="#1f7a45"/>
  <text class="muted" x="135" y="148" fill="#5b6660" font-size="11.5" text-anchor="middle">person A</text>
  <rect class="card" x="78" y="178" width="114" height="90" rx="6" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <circle class="fa" cx="135" cy="212" r="17" fill="#1f7a45"/>
  <text class="muted" x="135" y="256" fill="#5b6660" font-size="11.5" text-anchor="middle">person B</text>
  <rect class="ol" x="66" y="60" width="138" height="108" rx="6" fill="none" stroke="#1f7a45" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text class="acc" x="135" y="300" fill="#1f7a45" font-size="12" text-anchor="middle" font-weight="600">crop window</text>
  <path class="aline" d="M222 158 L300 158" fill="none" stroke="#1f7a45" stroke-width="1.5" marker-end="url(#aa)"/>
  <rect class="card" x="318" y="96" width="156" height="100" rx="8" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="muted" x="396" y="90" fill="#5b6660" font-size="12" text-anchor="middle">algorithm picks a crop</text>
  <text class="ink" x="396" y="132" fill="#1c2320" font-size="14" text-anchor="middle" font-weight="600">saliency</text>
  <text class="ink" x="396" y="152" fill="#1c2320" font-size="14" text-anchor="middle" font-weight="600">model</text>
  <text class="muted" x="396" y="176" fill="#5b6660" font-size="11" text-anchor="middle">trained on human data</text>
  <path class="aline" d="M486 146 L546 146" fill="none" stroke="#1f7a45" stroke-width="1.5" marker-end="url(#aa)"/>
  <rect class="soft" x="560" y="110" width="100" height="72" rx="8" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <circle class="fa" cx="610" cy="140" r="17" fill="#1f7a45"/>
  <text class="muted" x="610" y="104" fill="#5b6660" font-size="12" text-anchor="middle">preview</text>
  <text class="ink" x="610" y="174" fill="#1c2320" font-size="12" text-anchor="middle" font-weight="600">person A only</text>
  <text class="muted" x="340" y="338" fill="#5b6660" font-size="12.5" text-anchor="middle">Whoever the model leaves out is invisible to almost every reader.</text>
</svg>
