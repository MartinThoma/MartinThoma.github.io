<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="680" height="262" role="img" aria-labelledby="t d">
  <title id="t">The list [1, 2, 3, 4, 2] read as a linked list</title>
  <desc id="d">Five nodes with the indices 0 to 4 and the values 1, 2, 3, 4, 2. Each value is the index of the next node: 0 points to 1, 1 to 2, 2 to 3, 3 to 4, and 4 points back to 2. This back edge creates a cycle. Two nodes point to index 2, so 2 is the duplicate number, and it is where the cycle starts.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .line  { stroke: #676a72; }
      .aline { stroke: #4fc07d; }
      .mk    { fill: #676a72; }
      .mka   { fill: #4fc07d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#88888f"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mka" d="M0 0 L10 5 L0 10 z" fill="#1f7a45"/>
    </marker>
  </defs>
  <text class="ink" x="24" y="28" fill="#1c2320" font-size="16" text-anchor="start" font-weight="600">The list <tspan class="mono">[1, 2, 3, 4, 2]</tspan> as a linked list</text>
  <text class="muted" x="24" y="47" fill="#5b6660" font-size="12.5" text-anchor="start">Each value is the index of the next node.</text>
  <text class="muted" x="110" y="80" fill="#5b6660" font-size="12" text-anchor="end">index</text>
  <text class="muted" x="110" y="125" fill="#5b6660" font-size="12" text-anchor="end">value</text>
  <text class="muted mono" x="160" y="80" fill="#5b6660" font-size="13" text-anchor="middle">0</text>
  <rect class="card" x="128" y="92" width="64" height="56" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink mono" x="160" y="127" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">1</text>
  <path class="line" d="M192 120 L237 120" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="muted mono" x="274" y="80" fill="#5b6660" font-size="13" text-anchor="middle">1</text>
  <rect class="card" x="242" y="92" width="64" height="56" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink mono" x="274" y="127" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">2</text>
  <path class="line" d="M306 120 L351 120" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="muted mono" x="388" y="80" fill="#5b6660" font-size="13" text-anchor="middle">2</text>
  <rect class="soft" x="356" y="92" width="64" height="56" rx="10" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <text class="ink mono" x="388" y="127" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">3</text>
  <path class="line" d="M420 120 L465 120" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="muted mono" x="502" y="80" fill="#5b6660" font-size="13" text-anchor="middle">3</text>
  <rect class="card" x="470" y="92" width="64" height="56" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink mono" x="502" y="127" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">4</text>
  <path class="line" d="M534 120 L579 120" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="muted mono" x="616" y="80" fill="#5b6660" font-size="13" text-anchor="middle">4</text>
  <rect class="card" x="584" y="92" width="64" height="56" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink mono" x="616" y="127" fill="#1c2320" font-size="20" text-anchor="middle" font-weight="600">2</text>
  <path class="aline" d="M616 148 L616 180 Q616 192 604 192 L400 192 Q388 192 388 180 L388 154" fill="none" stroke="#1f7a45" stroke-width="2" marker-end="url(#aa)"/>
  <text class="acc" x="502" y="214" fill="#1f7a45" font-size="12.5" text-anchor="middle" font-weight="600">index 4 points back to index 2: a cycle</text>
  <text class="muted" x="340" y="246" fill="#5b6660" font-size="12.5" text-anchor="middle">Two nodes point to index 2, so 2 is the duplicate — and where the cycle starts.</text>
</svg>
