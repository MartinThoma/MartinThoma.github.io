<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="img" aria-labelledby="t d">
<title id="t">Kadane's algorithm on an example array</title>
<desc id="d">Bars show the array [9, -5, -5, -2, 1, 2, -1, 4, 5, 0, 1]. The maximum subarray goes from index 4 to 10 and has the sum 12. Below, the table lists current_sum and max_sum after each element. current_sum restarts at index 4 because the element alone is bigger than the running sum plus the element.</desc>
<style>
