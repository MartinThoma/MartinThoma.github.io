<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="t d">
<title id="t">Two ways to sort a file that does not fit into memory</title>
<desc id="d">Top: merge sort splits the file into chunks of arbitrary numbers, sorts each chunk in memory and then has to merge the sorted chunks. Bottom: radix sort splits the file by the prefix of the numbers, sorts each chunk in memory and then only pastes the chunks together in prefix order.</desc>
