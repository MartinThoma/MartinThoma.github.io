<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
  <title id="t">Two dependencies pin different versions of urllib3</title>
  <desc id="d">The package primer depends on botocore and on requests. botocore pins urllib3==1.0.2, requests pins urllib3==1.0.1. Only one version of urllib3 can be installed, so no installation satisfies both pins and the install fails.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .badt  { fill: #ef8a8a; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .bad   { fill: #2a1a1a; stroke: #ef8a8a; }
      .line  { stroke: #676a72; }
      .bline { stroke: #ef8a8a; }
      .mk    { fill: #676a72; }
      .mkb   { fill: #ef8a8a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#88888f"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mkb" d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
  </defs>
  <text class="ink" x="340" y="30" fill="#1c2320" font-size="16" text-anchor="middle" font-weight="600">Two dependencies pin different versions</text>

  <rect class="soft" x="250" y="54" width="180" height="56" rx="10" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <text class="ink mono" x="340" y="78" fill="#1c2320" font-size="15" text-anchor="middle" font-weight="600">primer</text>
  <text class="muted" x="340" y="98" fill="#5b6660" font-size="12" text-anchor="middle">the package you install</text>

  <path class="line" d="M300 110 C300 136 185 134 185 160" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>
  <path class="line" d="M380 110 C380 136 495 134 495 160" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="card" x="110" y="166" width="150" height="48" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink mono" x="185" y="195" fill="#1c2320" font-size="15" text-anchor="middle" font-weight="600">botocore</text>
  <rect class="card" x="420" y="166" width="150" height="48" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink mono" x="495" y="195" fill="#1c2320" font-size="15" text-anchor="middle" font-weight="600">requests</text>

  <path class="bline" d="M185 214 C185 250 300 244 300 282" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#ab)"/>
  <path class="bline" d="M495 214 C495 250 380 244 380 282" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect class="bad" x="150" y="234" width="128" height="24" rx="12" fill="#fbe9e9" stroke="#c62828" stroke-width="1.2"/>
  <text class="badt mono" x="214" y="250.5" fill="#c62828" font-size="12" text-anchor="middle">urllib3==1.0.2</text>
  <rect class="bad" x="402" y="234" width="128" height="24" rx="12" fill="#fbe9e9" stroke="#c62828" stroke-width="1.2"/>
  <text class="badt mono" x="466" y="250.5" fill="#c62828" font-size="12" text-anchor="middle">urllib3==1.0.1</text>

  <rect class="bad" x="230" y="288" width="220" height="56" rx="10" fill="#fbe9e9" stroke="#c62828" stroke-width="1.5"/>
  <text class="ink mono" x="340" y="312" fill="#1c2320" font-size="15" text-anchor="middle" font-weight="600">urllib3</text>
  <text class="badt" x="340" y="332" fill="#c62828" font-size="12" text-anchor="middle">cannot be 1.0.2 and 1.0.1 at once</text>

  <text class="muted" x="340" y="380" fill="#5b6660" font-size="12.5" text-anchor="middle">Only one version of a package can be installed, so the install fails.</text>
</svg>
