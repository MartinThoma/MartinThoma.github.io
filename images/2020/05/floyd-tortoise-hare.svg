<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d">
<title id="t">Floyd's tortoise and hare on a list with a loop</title>
<desc id="d">A linked list whose first 3 nodes lead into a loop of 6 nodes (μ = 3, λ = 6). Tortoise and hare start at the head and meet after t = 6 steps at node 6. In the second phase one pointer starts again at the head, the other one at the meeting point; after μ = 3 steps each, both reach node 3, the start of the loop.</desc>
<style>
