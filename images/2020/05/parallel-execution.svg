<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" width="680" height="232" role="img" aria-labelledby="t d">
  <title id="t">Parallel execution</title>
  <desc id="d">Timeline of two compute-bound tasks executed in parallel on two cores. Task b runs from time 0 to 5, task a from time 1 to 5. Both are done after 5 time units.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .soft  { fill: #16261d; stroke: #4fc07d; }
      .fa    { fill: #4fc07d; stroke: #4fc07d; }
      .line  { stroke: #676a72; }
      .aline { stroke: #4fc07d; }
      .mk    { fill: #676a72; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#88888f"/>
    </marker>
  </defs>
  <text class="ink" x="24" y="28" fill="#1c2320" font-size="16" text-anchor="start" font-weight="600">Parallel execution</text>
  <text class="muted" x="24" y="47" fill="#5b6660" font-size="12.5" text-anchor="start">Two cores: each task runs on its own core at the same time.</text>
  <text class="ink" x="98" y="92" fill="#1c2320" font-size="13.5" text-anchor="end" font-weight="600">task a</text>
  <rect class="sunk" x="112" y="70" width="504" height="34" rx="6" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <text class="ink" x="98" y="140" fill="#1c2320" font-size="13.5" text-anchor="end" font-weight="600">task b</text>
  <rect class="sunk" x="112" y="118" width="504" height="34" rx="6" fill="#ebebed" stroke="#d8d8de" stroke-width="1"/>
  <rect class="soft" x="113.5" y="119.5" width="277" height="31" rx="5" fill="#e0efe6" stroke="#1f7a45" stroke-width="1.5"/>
  <rect class="fa" x="169.5" y="71.5" width="221" height="31" rx="5" fill="#1f7a45" stroke="#1f7a45" stroke-width="1.5"/>
  <path class="line" d="M112 176 L650 176" fill="none" stroke="#88888f" stroke-width="1.5" marker-end="url(#a)"/>
  <path class="line" d="M112 172 L112 180" stroke="#88888f" stroke-width="1.5"/>
  <text class="muted" x="112" y="196" fill="#5b6660" font-size="12" text-anchor="middle">0</text>
  <path class="line" d="M168 172 L168 180" stroke="#88888f" stroke-width="1.5"/>
  <text class="muted" x="168" y="196" fill="#5b6660" font-size="12" text-anchor="middle">1</text>
  <path class="line" d="M224 172 L224 180" stroke="#88888f" stroke-width="1.5"/>
  <text class="muted" x="224" y="196" fill="#5b6660" font-size="12" text-anchor="middle">2</text>
  <path class="line" d="M280 172 L280 180" stroke="#88888f" stroke-width="1.5"/>
  <text class="muted" x="280" y="196" fill="#5b6660" font-size="12" text-anchor="middle">3</text>
  <path class="line" d="M336 172 L336 180" stroke="#88888f" stroke-width="1.5"/>
  <text class="muted" x="336" y="196" fill="#5b6660" font-size="12" text-anchor="middle">4</text>
  <path class="line" d="M392 172 L392 180" stroke="#88888f" stroke-width="1.5"/>
  <text class="muted" x="392" y="196" fill="#5b6660" font-size="12" text-anchor="middle">5</text>
  <path class="line" d="M448 172 L448 180" stroke="#88888f" stroke-width="1.5"/>
  <text class="muted" x="448" y="196" fill="#5b6660" font-size="12" text-anchor="middle">6</text>
  <path class="line" d="M504 172 L504 180" stroke="#88888f" stroke-width="1.5"/>
  <text class="muted" x="504" y="196" fill="#5b6660" font-size="12" text-anchor="middle">7</text>
  <path class="line" d="M560 172 L560 180" stroke="#88888f" stroke-width="1.5"/>
  <text class="muted" x="560" y="196" fill="#5b6660" font-size="12" text-anchor="middle">8</text>
  <path class="line" d="M616 172 L616 180" stroke="#88888f" stroke-width="1.5"/>
  <text class="muted" x="616" y="196" fill="#5b6660" font-size="12" text-anchor="middle">9</text>
  <text class="muted" x="650" y="166" fill="#5b6660" font-size="12" text-anchor="end">time</text>
  <path class="aline" d="M392 62 L392 176" fill="none" stroke="#1f7a45" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="acc" x="392" y="216" fill="#1f7a45" font-size="12.5" text-anchor="middle" font-weight="600">both done after 5</text>
</svg>
