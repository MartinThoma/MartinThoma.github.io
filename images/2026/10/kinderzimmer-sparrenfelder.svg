<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 356" width="704" height="356" role="img" aria-labelledby="t d">
  <title id="t">Sparrenfelder der Schräge im Kinderzimmer, Querschnitt</title>
  <desc id="d">Querschnitt durch die Schräge, Blick vom Raum. Von links nach rechts: Sparren 5 cm, Feld 20,5 cm, Sparren 7 cm, Feld 70 cm, Sparren 8 cm, Feld 68,5 cm, Sparren 8 cm, Feld 60 cm, Sparren 7 cm, Feld 31 cm, Sparren 4 cm, zusammen 2,89 m. Die Achsmaße der inneren Sparren sind 77,5, 76,5 und 67,5 cm. Die Sparrenhöhe ist mit 16 cm angenommen und noch zu messen. Oben liegt die Unterspannbahn, in den Feldern die neue Holzfaserdämmung, darunter Dampfbremse, CD-Profil und Gipskarton.</desc>
