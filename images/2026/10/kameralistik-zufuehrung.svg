<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
  <title id="t">Verwaltungshaushalt und Vermögenshaushalt einer Gemeinde und die Zuführung zwischen ihnen</title>
  <desc id="d">Der Verwaltungshaushalt für den laufenden Betrieb nimmt Steuern, Schlüsselzuweisungen vom Land sowie Gebühren, Mieten und Erstattungen ein. Er gibt Geld aus für Personal, Unterhalt, Energie und Material, die Kreisumlage, Zuschüsse etwa an Vereine und Zinsen. Kredite zur Finanzierung sind dort nicht erlaubt. Was übrig bleibt, fließt als Zuführung in den Vermögenshaushalt; die Zuführung muss mindestens die Tilgung decken. Der Vermögenshaushalt für Investitionen nimmt außerdem Fördermittel, Verkaufserlöse und Erschließungsbeiträge, Entnahmen aus der Rücklage und Kredite ein. Er bezahlt Baumaßnahmen, Grundstücke, Fahrzeuge und Geräte, die Tilgung von Krediten und Zuführungen an die Rücklage. Zwischen Vermögenshaushalt und Rücklage sowie zwischen Vermögenshaushalt und Bank fließt Geld in beide Richtungen.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc   { fill: #4fc07d; }
      .card  { fill: #1b1d22; stroke: #2e3036; }
      .sunk  { fill: #16171b; stroke: #2e3036; }
      .rule  { stroke: #2e3036; }
      .flow  { stroke: #4fc07d; }
      .line  { stroke: #9aa8a0; }
      .mk    { fill: #9aa8a0; }
      .mkacc { fill: #4fc07d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z" fill="#5b6660"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path class="mkacc" d="M0 0 L10 5 L0 10 z" fill="#1f7a45"/>
    </marker>
  </defs>

  <!-- Verwaltungshaushalt -->
  <rect class="card" x="16" y="16" width="300" height="350" rx="12" fill="#f7f7f9" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="166" y="46" fill="#1c2320" font-size="18" font-weight="700" text-anchor="middle">Verwaltungshaushalt</text>
  <text class="muted" x="166" y="67" fill="#5b6660" font-size="13.5" text-anchor="middle">laufender Betrieb</text>
  <line class="rule" x1="32" y1="82" x2="300" y2="82" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="acc" x="36" y="108" fill="#1f7a45" font-size="13.5" font-weight="700">Einnahmen</text>
  <g class="ink" fill="#1c2320" font-size="14">
    <text x="36" y="131">+ Steuern</text>
    <text x="36" y="152">+ Schlüsselzuweisungen vom Land</text>
    <text x="36" y="173">+ Gebühren, Mieten, Erstattungen</text>
  </g>
  <text class="acc" x="36" y="207" fill="#1f7a45" font-size="13.5" font-weight="700">Ausgaben</text>
  <g class="ink" fill="#1c2320" font-size="14">
    <text x="36" y="230">− Personal</text>
    <text x="36" y="251">− Unterhalt, Energie, Material</text>
    <text x="36" y="272">− Kreisumlage</text>
    <text x="36" y="293">− Zuschüsse, z. B. an Vereine</text>
    <text x="36" y="314">− Zinsen</text>
  </g>
  <text class="muted" x="166" y="398" fill="#5b6660" font-size="13.5" text-anchor="middle">Kredite zur Finanzierung</text>
  <text class="muted" x="166" y="417" fill="#5b6660" font-size="13.5" text-anchor="middle">sind hier nicht erlaubt.</text>

  <!-- Zuführung -->
  <line class="flow" x1="318" y1="190" x2="434" y2="190" stroke="#1f7a45" stroke-width="7" marker-end="url(#b)"/>
  <text class="ink" x="380" y="174" fill="#1c2320" font-size="15" font-weight="700" text-anchor="middle">Zuführung</text>
  <text class="muted" x="380" y="216" fill="#5b6660" font-size="12.5" text-anchor="middle">mindestens</text>
  <text class="muted" x="380" y="232" fill="#5b6660" font-size="12.5" text-anchor="middle">die Tilgung</text>

  <!-- Vermögenshaushalt -->
  <rect class="card" x="444" y="16" width="300" height="350" rx="12" fill="#f7f7f9" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="594" y="46" fill="#1c2320" font-size="18" font-weight="700" text-anchor="middle">Vermögenshaushalt</text>
  <text class="muted" x="594" y="67" fill="#5b6660" font-size="13.5" text-anchor="middle">Investitionen</text>
  <line class="rule" x1="460" y1="82" x2="728" y2="82" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="acc" x="464" y="108" fill="#1f7a45" font-size="13.5" font-weight="700">Einnahmen</text>
  <g class="ink" fill="#1c2320" font-size="14">
    <text x="464" y="131">+ Zuführung</text>
    <text x="464" y="152">+ Fördermittel</text>
    <text x="464" y="173">+ Verkäufe, Erschließungsbeiträge</text>
    <text x="464" y="194">+ Entnahme aus der Rücklage</text>
    <text x="464" y="215">+ Kredite</text>
  </g>
  <text class="acc" x="464" y="249" fill="#1f7a45" font-size="13.5" font-weight="700">Ausgaben</text>
  <g class="ink" fill="#1c2320" font-size="14">
    <text x="464" y="272">− Baumaßnahmen</text>
    <text x="464" y="293">− Grundstücke, Fahrzeuge, Geräte</text>
    <text x="464" y="314">− Tilgung von Krediten</text>
    <text x="464" y="335">− Zuführung an die Rücklage</text>
  </g>

  <!-- Rücklage und Bank -->
  <line class="line" x1="514" y1="370" x2="514" y2="404" stroke="#5b6660" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="line" x1="674" y1="370" x2="674" y2="404" stroke="#5b6660" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="sunk" x="444" y="408" width="140" height="50" rx="10" fill="#ebebed" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="514" y="429" fill="#1c2320" font-size="14" font-weight="600" text-anchor="middle">Rücklage</text>
  <text class="muted" x="514" y="447" fill="#5b6660" font-size="12.5" text-anchor="middle">das Sparbuch</text>
  <rect class="sunk" x="604" y="408" width="140" height="50" rx="10" fill="#ebebed" stroke="#d8d8de" stroke-width="1.5"/>
  <text class="ink" x="674" y="429" fill="#1c2320" font-size="14" font-weight="600" text-anchor="middle">Bank</text>
  <text class="muted" x="674" y="447" fill="#5b6660" font-size="12.5" text-anchor="middle">Kredite</text>
</svg>
