  <text x="436" y="370" class="muted" font-size="11" text-anchor="middle" transform="rotate(-90 436 370)">Kniestock</text>
  <text x="744" y="350" class="muted" font-size="11" text-anchor="middle" transform="rotate(-90 744 350)">Regal und Schrank</text>
