<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 498" width="820" height="498" role="img" aria-labelledby="t d">
  <title id="t">Grundriss und Längsschnitt des Kinderzimmers mit Maßen</title>
  <desc id="d">Grundriss: Der Raum ist 2,94 m breit und 4,20 m lang. Die hinteren rund 1,9 m liegen unter der Schräge, die bis zum Kniestock abfällt; der Rest hat einen geraden Teil, 2,40 m hoch. An der Wand gegenüber dem Kniestock sind ein Regal (0,90 m) und ein Schrank (2,00 × 0,58 m) geplant, es bleiben 4 cm Luft. Die Tür liegt in der Längswand nahe dem Regal. Längsschnitt: Der Kniestock ist rechnerisch rund 1,15 m hoch, die Schräge steigt mit rund 33 Grad bis auf 2,40 m. Abgewickelt ist die Decke 2,22 m plus 2,35 m lang.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .ink { fill: #1c2320; }
    .muted { fill: #5b6660; }
    .acc { fill: #1f7a45; }
    .wall { fill: none; stroke: #1c2320; stroke-width: 8; stroke-linejoin: miter; }
    .zone { fill: #e0efe6; }
    .knick { stroke: #1f7a45; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .gap { fill: #ffffff; }
    .door { stroke: #1c2320; stroke-width: 2.5; }
    .swing { fill: none; stroke: #5b6660; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .plan { fill: none; stroke: #1f7a45; stroke-width: 1.8; stroke-dasharray: 5 3; }
    .dim { stroke: #5b6660; stroke-width: 1; }
    .dimtick { stroke: #1c2320; stroke-width: 1.6; }
    .ext { stroke: #88888f; stroke-width: 0.8; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e7ede9; }
      .muted { fill: #9aa8a0; }
      .acc { fill: #4fc07d; }
      .wall { stroke: #e7ede9; }
      .zone { fill: #16261d; }
      .knick { stroke: #4fc07d; }
      .gap { fill: #1b1d22; }
      .door { stroke: #e7ede9; }
      .swing { stroke: #9aa8a0; }
      .plan { stroke: #4fc07d; }
      .dim { stroke: #9aa8a0; }
      .dimtick { stroke: #e7ede9; }
      .ext { stroke: #676a72; }
    }
  </style>
