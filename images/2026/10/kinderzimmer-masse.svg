  <path d="M 454 324 A 34 34 0 0 0 448.4 305.3" class="swing"/>
  <text x="466" y="318" class="ink" font-size="11" text-anchor="start">ca. 33°*</text>
  <text x="608" y="190" class="ink" font-size="11.5" text-anchor="middle">Decke abgewickelt: 2,22 m + 2,35 m = 4,57 m</text>
  <text x="608" y="206" class="muted" font-size="10.5" text-anchor="middle">(welche Fläche die Schräge ist, ist noch offen)</text>
