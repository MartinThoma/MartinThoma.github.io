<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 869 531" width="869" height="531" role="img" aria-labelledby="t d">
  <title id="t">Grundriss und Längsschnitt des Kinderzimmers mit Maßen</title>
  <desc id="d">Grundriss: Der Raum ist 2,96 m breit und 4,21 bis 4,22 m lang. Die ersten 2,21 m von der Schrankwand aus hat er einen geraden Teil, 2,39 bis 2,41 m hoch; auf den letzten 2,00 m fällt die Schräge zum Kniestock ab. In der Türwand beginnt die Zarge 0,29 m von der Schrankwand, der Durchgang ist 0,82 m breit. In der Fensterwand liegt 0,99 m von der Schrankwand eine 1,09 m breite Fensternische mit Heizkörper. An der Schrankwand sind ein Regal (0,90 m) und ein Schrank (2,00 × 0,58 m) geplant, es bleiben 5 bis 6 cm Luft. Die Wasseranschlüsse liegen an der Türwand unter der Schräge. Längsschnitt mit Blick auf die Türwand: Die Schräge ist rund 2,30 m lang und 29,5 Grad geneigt, der Kniestock rund 1,26 m hoch; berechnet aus einem Messpunkt 1,78 m hoch und 3,30 m von der Schrankwand. Die Tür ist 0,82 × 1,97 m groß, die Fliesen beginnen auf 0,87 m Höhe.</desc>
