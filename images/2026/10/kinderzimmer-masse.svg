  <text x="32" y="486" class="muted" font-size="10.5" text-anchor="start">* berechnet aus 4,20 m Raumlänge und den Deckenmaßen 2,22 m und 2,35 m; Lage der Tür nach Foto geschätzt; Regal und Schrank geplant</text>
