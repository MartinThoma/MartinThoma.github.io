<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 366" width="772" height="366" role="img" aria-labelledby="t d">
  <title id="t">Non-repeatable read</title>
  <desc id="d">T1 reads the balance 100. T2 sets it to 50 and commits. T1 reads the same row again and now gets 50.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sql { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
    .bg { fill: #ffffff; }
    .ink { fill: #1c2320; } .muted { fill: #5b6660; }
    .lane { fill: #f3f4f5; }
    .t1box { fill: #e8eff8; stroke: #1d4f91; } .t1 { fill: #1d4f91; } .t1line { stroke: #1d4f91; }
    .t2box { fill: #e0efe6; stroke: #1f7a45; } .t2 { fill: #1f7a45; } .t2line { stroke: #1f7a45; }
    .dbbox { fill: #ffffff; stroke: #88888f; }
    .dbwarn { fill: #fbeedd; stroke: #a2560f; } .warn { fill: #a2560f; }
    .bad { fill: #c62828; } .badline { stroke: #c62828; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1d22; }
      .ink { fill: #e7ede9; } .muted { fill: #9aa8a0; }
      .lane { fill: #22252b; }
      .t1box { fill: #1c2838; stroke: #8fb8ee; } .t1 { fill: #8fb8ee; } .t1line { stroke: #8fb8ee; }
      .t2box { fill: #16261d; stroke: #4fc07d; } .t2 { fill: #4fc07d; } .t2line { stroke: #4fc07d; }
      .dbbox { fill: #1b1d22; stroke: #676a72; }
      .dbwarn { fill: #2e2216; stroke: #edbd85; } .warn { fill: #edbd85; }
      .bad { fill: #ff8a80; } .badline { stroke: #ff8a80; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="t1"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="t2"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bad"/></marker>
  </defs>
  <rect class="bg" width="772" height="366"/>
  <rect class="lane" x="16" y="34" width="240" height="290" rx="10"/>
  <rect class="lane" x="326" y="34" width="120" height="290" rx="10"/>
  <rect class="lane" x="516" y="34" width="240" height="290" rx="10"/>
  <text x="136.0" y="24" class="t1" text-anchor="middle" font-size="14" font-weight="700">Transaction T1</text>
  <text x="386.0" y="24" class="ink" text-anchor="middle" font-size="14" font-weight="700">Database</text>
  <text x="636.0" y="24" class="t2" text-anchor="middle" font-size="14" font-weight="700">Transaction T2</text>
  <text x="386.0" y="52" class="muted" text-anchor="middle" font-size="11">balance of account 1</text>
  <rect class="dbbox" x="334" y="64" width="104" height="36" rx="6" stroke-width="1.2"/>
  <text x="386.0" y="81.0" class="ink" text-anchor="middle" font-size="15" font-weight="700">100</text>
  <text x="386.0" y="95.0" class="muted" text-anchor="middle" font-size="10.5">committed</text>
  <text x="28" y="86.0" class="muted" text-anchor="start" font-size="12">Start</text>
  <rect class="dbbox" x="334" y="118" width="104" height="48" rx="6" stroke-width="1.2"/>
  <text x="386.0" y="141.0" class="ink" text-anchor="middle" font-size="15" font-weight="700">100</text>
  <text x="386.0" y="155.0" class="muted" text-anchor="middle" font-size="10.5">committed</text>
  <rect class="t1box" x="24" y="118" width="224" height="48" rx="6" stroke-width="1.2"/>
  <text x="34" y="139" class="sql ink" text-anchor="start">SELECT balance FROM accounts</text>
  <text x="34" y="155" class="sql ink" text-anchor="start">WHERE id = 1</text>
  <line x1="332" y1="142.0" x2="250" y2="142.0" class="t1line" stroke-width="2" marker-end="url(#a1)"/>
  <text x="291.0" y="135.0" class="t1" text-anchor="middle" font-size="13" font-weight="700">100</text>
  <rect class="dbbox" x="334" y="184" width="104" height="64" rx="6" stroke-width="1.2"/>
  <text x="386.0" y="215.0" class="ink" text-anchor="middle" font-size="15" font-weight="700">50</text>
  <text x="386.0" y="229.0" class="muted" text-anchor="middle" font-size="10.5">committed</text>
  <rect class="t2box" x="524" y="184" width="224" height="64" rx="6" stroke-width="1.2"/>
  <text x="534" y="205" class="sql ink" text-anchor="start">UPDATE accounts</text>
  <text x="534" y="221" class="sql ink" text-anchor="start">SET balance = 50 WHERE id = 1</text>
  <text x="534" y="237" class="sql ink" text-anchor="start">COMMIT</text>
  <line x1="522" y1="216.0" x2="440" y2="216.0" class="t2line" stroke-width="2" marker-end="url(#a2)"/>
  <rect class="dbbox" x="334" y="266" width="104" height="48" rx="6" stroke-width="1.2"/>
  <text x="386.0" y="289.0" class="ink" text-anchor="middle" font-size="15" font-weight="700">50</text>
  <text x="386.0" y="303.0" class="muted" text-anchor="middle" font-size="10.5">committed</text>
  <rect class="t1box" x="24" y="266" width="224" height="48" rx="6" stroke-width="1.2"/>
  <text x="34" y="287" class="sql ink" text-anchor="start">SELECT balance FROM accounts</text>
  <text x="34" y="303" class="sql ink" text-anchor="start">WHERE id = 1</text>
  <line x1="332" y1="290.0" x2="250" y2="290.0" class="badline" stroke-width="2" marker-end="url(#ab)"/>
  <text x="291.0" y="283.0" class="bad" text-anchor="middle" font-size="13" font-weight="700">50</text>
  <text x="386.0" y="352" class="bad" text-anchor="middle" font-size="13" font-weight="600">Same row, same transaction, two different values.</text>
</svg>
