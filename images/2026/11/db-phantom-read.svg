<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 382" width="772" height="382" role="img" aria-labelledby="t d">
  <title id="t">Phantom read</title>
  <desc id="d">T1 counts the accounts with a balance over 1000 and gets 3. T2 inserts account 42 with a balance of 5000 and commits. T1 counts again and gets 4.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sql { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
    .bg { fill: #ffffff; }
    .ink { fill: #1c2320; } .muted { fill: #5b6660; }
    .lane { fill: #f3f4f5; }
    .t1box { fill: #e8eff8; stroke: #1d4f91; } .t1 { fill: #1d4f91; } .t1line { stroke: #1d4f91; }
    .t2box { fill: #e0efe6; stroke: #1f7a45; } .t2 { fill: #1f7a45; } .t2line { stroke: #1f7a45; }
    .dbbox { fill: #ffffff; stroke: #88888f; }
    .dbwarn { fill: #fbeedd; stroke: #a2560f; } .warn { fill: #a2560f; }
    .bad { fill: #c62828; } .badline { stroke: #c62828; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1d22; }
      .ink { fill: #e7ede9; } .muted { fill: #9aa8a0; }
      .lane { fill: #22252b; }
      .t1box { fill: #1c2838; stroke: #8fb8ee; } .t1 { fill: #8fb8ee; } .t1line { stroke: #8fb8ee; }
      .t2box { fill: #16261d; stroke: #4fc07d; } .t2 { fill: #4fc07d; } .t2line { stroke: #4fc07d; }
      .dbbox { fill: #1b1d22; stroke: #676a72; }
      .dbwarn { fill: #2e2216; stroke: #edbd85; } .warn { fill: #edbd85; }
      .bad { fill: #ff8a80; } .badline { stroke: #ff8a80; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="t1"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="t2"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bad"/></marker>
  </defs>
  <rect class="bg" width="772" height="382"/>
  <rect class="lane" x="16" y="34" width="240" height="306" rx="10"/>
  <rect class="lane" x="326" y="34" width="120" height="306" rx="10"/>
  <rect class="lane" x="516" y="34" width="240" height="306" rx="10"/>
  <text x="136.0" y="24" class="t1" text-anchor="middle" font-size="14" font-weight="700">Transaction T1</text>
  <text x="386.0" y="24" class="ink" text-anchor="middle" font-size="14" font-weight="700">Database</text>
  <text x="636.0" y="24" class="t2" text-anchor="middle" font-size="14" font-weight="700">Transaction T2</text>
  <text x="386.0" y="52" class="muted" text-anchor="middle" font-size="11">accounts with balance &gt; 1000</text>
  <rect class="dbbox" x="334" y="64" width="104" height="36" rx="6" stroke-width="1.2"/>
  <text x="386.0" y="81.0" class="ink" text-anchor="middle" font-size="15" font-weight="700">3 rows</text>
  <text x="386.0" y="95.0" class="muted" text-anchor="middle" font-size="10.5">committed</text>
  <text x="28" y="86.0" class="muted" text-anchor="start" font-size="12">Start</text>
  <rect class="dbbox" x="334" y="118" width="104" height="48" rx="6" stroke-width="1.2"/>
  <text x="386.0" y="141.0" class="ink" text-anchor="middle" font-size="15" font-weight="700">3 rows</text>
  <text x="386.0" y="155.0" class="muted" text-anchor="middle" font-size="10.5">committed</text>
  <rect class="t1box" x="24" y="118" width="224" height="48" rx="6" stroke-width="1.2"/>
  <text x="34" y="139" class="sql ink" text-anchor="start">SELECT COUNT(*) FROM accounts</text>
  <text x="34" y="155" class="sql ink" text-anchor="start">WHERE balance &gt; 1000</text>
  <line x1="332" y1="142.0" x2="250" y2="142.0" class="t1line" stroke-width="2" marker-end="url(#a1)"/>
  <text x="291.0" y="135.0" class="t1" text-anchor="middle" font-size="13" font-weight="700">3</text>
  <rect class="dbbox" x="334" y="184" width="104" height="80" rx="6" stroke-width="1.2"/>
  <text x="386.0" y="223.0" class="ink" text-anchor="middle" font-size="15" font-weight="700">4 rows</text>
  <text x="386.0" y="237.0" class="muted" text-anchor="middle" font-size="10.5">+ account 42</text>
  <rect class="t2box" x="524" y="184" width="224" height="80" rx="6" stroke-width="1.2"/>
  <text x="534" y="205" class="sql ink" text-anchor="start">INSERT INTO accounts</text>
  <text x="534" y="221" class="sql ink" text-anchor="start">(id, balance)</text>
  <text x="534" y="237" class="sql ink" text-anchor="start">VALUES (42, 5000)</text>
  <text x="534" y="253" class="sql ink" text-anchor="start">COMMIT</text>
  <line x1="522" y1="224.0" x2="440" y2="224.0" class="t2line" stroke-width="2" marker-end="url(#a2)"/>
  <rect class="dbbox" x="334" y="282" width="104" height="48" rx="6" stroke-width="1.2"/>
  <text x="386.0" y="305.0" class="ink" text-anchor="middle" font-size="15" font-weight="700">4 rows</text>
  <text x="386.0" y="319.0" class="muted" text-anchor="middle" font-size="10.5">committed</text>
  <rect class="t1box" x="24" y="282" width="224" height="48" rx="6" stroke-width="1.2"/>
  <text x="34" y="303" class="sql ink" text-anchor="start">SELECT COUNT(*) FROM accounts</text>
  <text x="34" y="319" class="sql ink" text-anchor="start">WHERE balance &gt; 1000</text>
  <line x1="332" y1="306.0" x2="250" y2="306.0" class="badline" stroke-width="2" marker-end="url(#ab)"/>
  <text x="291.0" y="299.0" class="bad" text-anchor="middle" font-size="13" font-weight="700">4</text>
  <text x="386.0" y="368" class="bad" text-anchor="middle" font-size="13" font-weight="600">No row T1 has read changed, but a new row matches.</text>
</svg>
