# Pre-commit configuration for blog quality assurance
# Run with: pre-commit run --all-files
repos:
  # Blog-specific auto-fixes
  - repo: local
    hooks:
      - id: auto-fix-blog
        name: Auto-fix Blog Articles
        entry: uv run python scripts/auto_fix_blog.py
        language: system
        files: '^content/.*\.md$'
        description: 'Auto-fix numbers, tags, formatting in blog articles'
        pass_filenames: false

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-json
        files: \.(json)$
      - id: check-yaml
        files: '^(?!content/).*\.ya?ml$'  # Exclude content files (front matter)
      - id: mixed-line-ending
      - id: end-of-file-fixer
        exclude: polyglot.py$
        files: '^content/.*\.md$'
      - id: trailing-whitespace
        exclude: polyglot.py$
        files: '^content/.*\.md$'

  # Python code formatting (formats ```python blocks in Markdown)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-format
        files: '^content/.*\.md$'
        args: [--target-version, py38, --line-length, "79"]
