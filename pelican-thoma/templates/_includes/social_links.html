{% if SOCIAL %}
{% from '_includes/_defaults.html' import SOCIAL_PROFILE_LABEL with context %}
<div class="meta-group social">
<h4>{{ SOCIAL_PROFILE_LABEL }}</h4>
<ul class="list-of-tags">
{# SOCIAL entries: (kind of channel, URL) #}
{% for label, url in SOCIAL %}
    <li><a href="{{ url|e }}" rel="me"{% if not url.startswith('mailto:') %} target="_blank"{% endif %}>{{ label|e }}</a></li>
{% endfor %}
</ul>
</div>
{% endif %}
